<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai 5</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <style>
        /*Loại 2: Internal Style */
        h2{
            /* color dùng để quy định màu chữ */
            color:red;
        }
        
         #TieuDe {
                color:orange
            }
        
    </style>
</head>
<body>
    <!--I:Các kiểu viết style-->
    <!--Kiểu 1 : Viết style trong thẻ-->
    <!--Loại 1 : Inline style-->
    <h1 style="color:blue">HUMG</h1>
    <!--Kiểu 2-->
    <h2>Trường đại học Mỏ - Địa chất</h2>
    <h3>Lớp phát triển ứng dụng Web</h3>
    <!--II:Selector-->
    <!--Cách 1:Dùng tên thẻ-->
    <!--Cách 2:Dùng id-->
    <h2 id="TieuDe">Trường đại học Mỏ - Địa chất</h2>
    <!--Cách 3:Dùng class(Viết dấu . trước tên class)-->
    <h2 id="TieuDe" class="TieuDe">Trường đại học Mỏ - Địa chất</h2>
    <h3 class="TieuDe2">Lớp phát triển ứng dụng Web</h3>

</body>
</html>
