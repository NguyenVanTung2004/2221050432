<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai 6</title>
    <style>
        p{
            color:blue;
        }
        p.nhom{
            color:brown;
            
        }
        .khoi1{
            background-color: green;    
        }
        .khoi2{
            background-color:yellow;
            /*1 Giá trị xung : cách đều xung quanh = giá trị đó */
            /*2 Giá trị : đầu tiên (trên,dưới), giá trị 2 (trái,phải)*/
            /*4 Giá trị : đầu(trên), giá trị 2(phải), giá trị 3(dưới), giá trị 4(trái)*/
            margin: auto; /*căn giữa*/
            width: 100px;
            
        }
        .khoi3{
            background-color: red;
        }
        .khoi4{
            background-color: grey;
            display: flex;
            

        }
        .khoi5{
            background-color: blueviolet;
            width: 50%;
        }
        .khoi6{
            background-color: orange;
            width: 50%;
        }
    </style>
</head>
<body>
    <p >Trường đại học Mỏ - Địa chất</p>
    <p class="nhom">Nhóm 03</p>
    <div class="khoi1">Khối 1</div>
    <div class="khoi2">Khối 2</div>
    <div class="khoi3">Khối 3</div>

    <div class="khoi4">
        <div class="khoi5">Khối 5</div>
        <div class="khoi6">Khối 6</div>
    </div>

</body>
</html>
