<html>
    <head>
        <title>bai1 html</title>
    </head>
    <body>
        Môn phát triển ứng dụng WEB + BTL 
        
        
        <!--Để chú thích dùng 2 cách
            C1: Cttrl+K+C 
            C2: + /
        Đây là chú thích -->
        
        
        <p> Thẻ p là thẻ phân đoạn </p>

        <!-- Thẻ h là thẻ định dạng đề mục -->
        <h1> Thẻ H1 </h1>
        <h2> Thẻ H2 </h2>
        <h3> Thẻ H3 </h3>

        <p>Môn web <br> Nhóm 03</p>

        <!-- Thẻ div và span để phân chia đoạn -->
         <div>Đây là thẻ div</div>
         <span>Đây là thẻ span</span>  <br>

         <!-- Thẻ b : Viết đậm
          Thẻ i : viết nghiêng
          Thẻ u : Gạch chân -->

         <b>Thẻ b</b><br>
         <i>Thẻ i</i><br>
         <u>Thẻ u</u><br>

         <div>
                <font face="verdana">Môn phát triển ứng dụng Web</font>
                <font color ="blue">Nhóm 03</font>
                <font size ="30">Tiết 1 2</font><br>
                <font color="blue" size="5" face="arial">Tùng đẹp trai</font>
        <div>
         </div>

    </body>
</html>
