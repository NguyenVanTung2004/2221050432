    <h1>Tinh Tuoi</h1>
    <div>

    </div>

        <button onclick="tinhTuoi()">Tinh tuoi</button>
    </div>
    <div>

    </div>
    <script>
        function  tinhTuoi(){
             var namSinh = parseInt(document.getElementById("namSinh").value);
             var thoiGian = new Date();
             var namNay = thoiGian.getFullYear();
             var tuoi = namNay - namSinh;

             document.getElementById("tuoi").value = tuoi;
        }
       
         
         function tinhDiem(){
            var a = parseFloat(document.getElementById("diemA").value);
            var b = parseFloat(document.getElementById("diemB").value);
            var c = parseFloat(document.getElementById("diemC").value);

            //document.write("Diem A nhap vao la :",a);
            //document.write("<br>Diem B nhap vao la :",b);
            //document.write("<br>Diem C nhap vao la :",c);

            document.getElementById("ketQua").value = tinhDiemChu(a,b,c);
         }

             function tinhDiemChu(a,b,c) {
                var tong = a * 0.6 + b * 0.3 + c * 0.1;
                var kq = "";
                if (tong >= 0 && tong < 4){
                    kq = "F";
                }
                else if(tong >= 4 && tong < 6){
                    kq = "D";

                }
                else if(tong >= 6 && tong < 7){
                    kq = "C";

                }
                else if(tong >= 7 && tong < 8){
                    kq = "B";

                }
                else if(tong >= 8 && tong < 10){
                    kq = "A";

                }
                else{
                    kq = "Diem khong hop le";
                }
                return kq;

            
         }
