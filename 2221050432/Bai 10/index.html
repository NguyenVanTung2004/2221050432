<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .che-do{
            color: red;
        }
        .anh,
        .chuc-nang{
             /*display: flex;
            justify-content: center;*/
        }
        .khung{
            width: 100%;
            text-align: center;
        }
        img{
            width: 20%;
            margin:0 auto;
        }
        
            
        
    </style>
</head>
<body>
    <div class="khung">
        <h1 class="che-do">Che do sang</h1>
        <img class="anh" src="bai9 -javascript/mattroi.png" alt = "">
        <div class="chuc-nang">
            <button onclick="doiCheDo()">Doi che do</button>
        </div>
    </div>
    <script>
        var cheDo = true;
        function doiCheDo() {
          if (cheDo == true)  {    
          document.getElementsByTagName("body")[0].style = "background-color: black";
          document.getElementsByClassName("che-do")[0].style = "color: white";
          document.getElementsByClassName("che-do")[0].innerHTML = "Che do toi";
          document.getElementsByTagName("img")[0].src = "bai9 -javascript/mattrang.png";
          cheDo = false;
          }
          else{
           document.getElementsByTagName("body")[0].style = "background-color: white";
          document.getElementsByClassName("che-do")[0].style = "color: black";
          document.getElementsByClassName("che-do")[0].innerHTML = "Che do sang";
          document.getElementsByTagName("img")[0].src = "bai9 -javascript/mattroi.png";
          cheDo = true; 
            
          }
        }

    </script>
</body>
</html>
